name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction
      - name: Run PHPCS linting
        run: composer run-phpcs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: npm install
      - name: Build assets
        run: npm run build
      - name: Lint JS
        run: npm run lint:js
      - name: Run Node Tests
        run: npm run test:scripts
      - name: Run Prod Build Tests
        run: npm run test:prod-build

  theme-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: npm install
      - name: Audit Theme (Banned Files & Security)
        # We only run specific checks in CI for the rig itself because WP Rig is a starter framework, 
        # not a final directory submission (it fails plugin-territory intentionally due to blocks).
        run: |
          npm run audit:banned-files -- --fail-on=required
          npm run audit:security-patterns -- --fail-on=required
